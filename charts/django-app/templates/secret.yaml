{{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-app
type: Opaque
stringData:
  DB_USER: {{ .Values.secret.dbUser | required "secret.dbUser is required" | quote }}
  DB_PASSWORD: {{ .Values.secret.dbPassword | required "secret.dbPassword is required; provide it with a private values file or --set-string" | quote }}
  SECRET_KEY: {{ .Values.secret.djangoSecretKey | required "secret.djangoSecretKey is required; provide it with a private values file or --set-string" | quote }}
{{- end }}
