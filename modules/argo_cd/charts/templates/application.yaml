{{- range .Values.applications }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
spec:
  project: {{ .project | default "default" }}
  source:
    repoURL: {{ .repoUrl | quote }}
    targetRevision: {{ .targetRevision | quote }}
    path: {{ .path | quote }}
    helm:
      {{- if .helmParameters }}
      parameters:
        {{- range .helmParameters }}
        - name: {{ .name | quote }}
          value: {{ .value | quote }}
        {{- end }}
      {{- end }}
  destination:
    name: {{ .destinationName | default "in-cluster" | quote }}
    namespace: {{ .destinationNamespace | quote }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      {{- range .syncOptions }}
      - {{ . | quote }}
      {{- end }}
---
{{- end }}
