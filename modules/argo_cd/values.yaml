server:
  replicas: 1
  service:
    type: ${service_type}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

configs:
  params:
    server.insecure: true
  repositories: |
    - url: https://github.com/IvankoBoichuk/devops-ci-cd.git
      name: main-repo
      type: git

repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
