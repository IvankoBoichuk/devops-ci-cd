server:
  replicas: 1
  service:
    type: ${service_type}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

configs:
  params:
    server.insecure: true
  repositories:
    main-repo:
      url: ${repo_url}
      type: git
      name: main-repo
%{ if repo_username != "" ~}
      username: ${repo_username}
%{ endif ~}
%{ if repo_password != "" ~}
      password: ${repo_password}
%{ endif ~}

repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
